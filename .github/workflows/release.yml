name: Build and Release EXE

on:
  workflow_dispatch: # اجازه اجرای دستی از تب Actions را می‌دهد
  push:
    tags:
      - 'v*' # با زدن تگی مثل v1.0.0 اجرا می‌شود

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller

    - name: Build EXE using winbuilder
      run: |
        python winbuilder.py

    - name: Check for EXE
      shell: pwsh
      run: |
        # این بخش چک می‌کند که آیا فایل واقعاً ساخته شده یا نه
        if (!(Test-Path "dist/Conduit-Manager-Windows.exe")) {
          Write-Error "Error: dist/Conduit-Manager-Windows.exe not found!"
          exit 1
        }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Conduit-Manager-Windows.exe
        name: Release ${{ github.ref_name || 'Manual Build' }}
        tag_name: ${{ github.ref_name || 'manual-build' }}
        draft: false
        prerelease: false
        body: |
          ## 🚀 Automated Build
          
          **Conduit Manager CLI** - Windows Standalone Executable
          
          ### 📋 Information
          - Built via GitHub Actions.
          - Runtime: Windows Latest.
          
          ### ⚠️ Note
          This tool requires **Administrator Privileges** for Packet Monitoring features.
