name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller # اطمینان از نصب بودن کتابخانه بیلد

    - name: Build EXE using winbuilder
      run: |
        python winbuilder.py

    - name: Check for EXE
      shell: pwsh
      run: |
        if (!(Test-Path "dist/Conduit-Manager-Windows.exe")) {
          Write-Error "فایل EXE در مسیر dist پیدا نشد. نام خروجی در winbuilder.py را چک کن."
          exit 1
        }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/Conduit-Manager-Windows.exe
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ## 🚀 New Update: ${{ github.ref_name }}
          
          **Conduit Manager CLI** - Automated Build for Windows
          
          ### 📋 Changelog
          - Latest updates applied.
          - Automatic executable build via GitHub Actions.
          
          ### ⚠️ Note
          This tool requires **Administrator Privileges** to run properly (for Packet Monitoring).
          
          ### 🛡 VirusTotal Check
          You can upload `Conduit-Manager-Windows.exe` to VirusTotal to verify its safety.
